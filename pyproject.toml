[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ELias", email = "elias2005new@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
